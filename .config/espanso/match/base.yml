  ############### Dev console when using youtube, hit f12 and type to make player faster or slower ############################

  - trigger: ";;yt5;"
    replace: "document.querySelector('video').currentTime += 5;"

  - trigger: ";;yt-5;"
    replace: "document.querySelector('video').currentTime -= 5;"

  - trigger: ";;yt4;"
