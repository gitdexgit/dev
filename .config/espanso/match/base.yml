matches:

  ##################### Esentials ###############################333

  # old ;;timer; used to look like this
  # - trigger: ";;timer;"
  #   replace: "echo \"\\n [$|$] \\n\" ; timer"


  - trigger: ";;p;"
    force_mode: clipboard
    replace: "Be concise and direct. Prioritize understanding over style. Use plain language. Don't invent facts. If you're unsure, say so. If the request is genuinely ambiguous, ask for clarification.


    "


  - trigger: ";;pu;"
    replace: "{{output}}"
    force_clipboard: true
    paste_shortcut: "CTRL+V"
    vars:
      - name: output
        type: shell
        params:
          cmd: "cat ~/ai/prompts/unslop.md"

  - trigger: ";;pw;"
    replace: "{{output}}"
    force_clipboard: true
    paste_shortcut: "CTRL+V"
    vars:
      - name: output
        type: shell
        params:
          cmd: "cat ~/ai/prompts/wait-what.md"



  - trigger: ";;pb;"
    replace: "{{output}}"
    force_clipboard: true
    paste_shortcut: "CTRL+V"
    vars:
      - name: output
        type: shell
        params:
          cmd: "cat ~/ai/prompts/bro.md"


  - trigger: ";;timer;"
    replace: "echo $|$; timer"

  # very useful when asking and answering questions to llm
  - trigger: ";;q;"
    force_mode: clipboard
    vars:
      - name: clip
        type: clipboard
    replace: |
      questions:
      {{clip}}
      answer:

  - trigger: ";;qq;"
    force_mode: clipboard
    vars:
      - name: clip
        type: clipboard
    replace: |
      questions:
      $|$
      answer:

  - trigger: ";;todo;"
    replace: "- [ ] "

  ################ Coding blocks #######################
  - trigger: ";;`bash;"
    replace: "```bash\n$|$\n```"
    propagate_case: false

  - trigger: ";;`py;"
    replace: "```py\n$|$\n```"
    propagate_case: false

  - trigger: ";;`c;"
    replace: "```c\n$|$\n```"
    propagate_case: false

  - trigger: ";;`scm;"
    replace: "```c\n$|$\n```"
    propagate_case: false

  - trigger: ";;`elisp;"
    replace: "```c\n$|$\n```"
    propagate_case: false

  - trigger: ";;`lua;"
    replace: "```lua\n$|$\n```"
    propagate_case: false

  - trigger: ";;`;"
    replace: "```\n$|$\n```"
    propagate_case: false



  ################ Coding blocks with clipboard content inside #######################
  - trigger: ";;cb;"
    replace: "```\n{{content}}\n```\n\n"
    force_clipboard: true
    paste_shortcut: "Ctrl+V"
    vars:
      - name: content
        type: shell
        params:
          cmd: "bash ~/scripts/espanso/paste-wrapped.sh"

  - trigger: ";;discord-hide;"
    replace: |
      const avatarHide = document.createElement("style");
      avatarHide.textContent = `
        [class*="avatar_"],
        img[class*="avatar"],
        img[src*="/avatars/"] {
          display: none !important;
        }
      `;
      document.head.appendChild(avatarHide);
    force_clipboard: true
    paste_shortcut: "CTRL+V"

  - trigger: ";;luacb;"
    replace: "```lua\n{{content}}\n```\n\n"
    force_clipboard: true
    paste_shortcut: "Ctrl+V"
    vars:
      - name: content
        type: shell
        params:
          cmd: "bash ~/scripts/espanso/paste-wrapped.sh"


  - trigger: ";;ccb;"
