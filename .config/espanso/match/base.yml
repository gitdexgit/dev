  - trigger: "ts;;p;"
    replace: "```ts\n{{content}}\n```\n\n"
    force_clipboard: true
    paste_shortcut: "Ctrl+V"
    vars:
      - name: content
        type: shell
        params:
          cmd: "bash ~/scripts/espanso/paste-wrapped.sh"


  - trigger: ";;p;"
    replace: "```\n{{content}}\n```\n\n"
    force_clipboard: true
    paste_shortcut: "Ctrl+V"
    vars:
      - name: content
        type: shell
        params:
          cmd: "bash ~/scripts/espanso/paste-wrapped.sh"


  - trigger: ";;gc=;"
    force_mode: clipboard
    replace: |
      == _)
      == W{{mydate}}
      == ==START============================================================
      == ""{{my_title}}"" START
      == ===================================================================

      == [[]]

      == DESCRIPTION:

      == Why?:

      == Solution?:

      == ====================================================================

      $|$

      == ====================================================================
      == ""{{my_title}}"" END
      == ===END==============================================================
    vars:
      - name: my_title
        type: shell
        params:
          # cmd: bash '/home/dex/scripts/ddesk/espanso/insert_comment_gc_hashtag.sh'
          cmd:
            'zenity --entry --title="Comment Header" --text="Enter the header title:"'
      - name: mydate
        type: date
        params:
          format: "%V %a, %d at %H:%M"


  - trigger: ";;gc-;"
    force_mode: clipboard
    replace: |
      -- _)
      -- W{{mydate}}
      -- --START------------------------------------------------------------
      -- ""{{my_title}}"" START
