  ############### Dev console when using youtube, hit f12 and type to make player faster or slower ############################

  - trigger: ";;yt5;"
    replace: "document.querySelector('video').currentTime += 5;"

  - trigger: ";;yt-5;"
    replace: "document.querySelector('video').currentTime -= 5;"

  - trigger: ";;yt4;"
    replace: "document.querySelector('video').currentTime += 4;"

  - trigger: ";;yt-4;"
    replace: "document.querySelector('video').currentTime -= 4;"

  - trigger: ";;yt3;"
    replace: "document.querySelector('video').currentTime += 3;"

  - trigger: ";;yt-3;"
    replace: "document.querySelector('video').currentTime -= 3;"

  - trigger: ";;yt2;"
    replace: "document.querySelector('video').currentTime += 2;"

  - trigger: ";;yt-2;"
    replace: "document.querySelector('video').currentTime -= 2;"

  - trigger: ";;yt2.5;"
    replace: "document.querySelector('video').currentTime += 2.5;"

  - trigger: ";;yt-2.5;"
