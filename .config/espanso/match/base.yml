      # ---END--------------------------------------------------------------
    vars:
      - name: my_title
        type: shell
        params:
          # cmd: bash '/home/dex/scripts/ddesk/espanso/insert_comment_gc_hashtag.sh'
          cmd:
            'zenity --entry --title="Comment Header" --text="Enter the header title:"'
      - name: mydate
        type: date
        params:
          format: "%V %a, %d at %H:%M"
