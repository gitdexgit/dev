matches:

  - trigger: ";;date;"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%d/%m/%Y\n%a, %d, %B\n%H:%M\n\n"

  - trigger: ";;d;"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          # Format: YYYY-MM-DD_HH-MM-SS (24-hour time)
          format: "%Y-%m-%d_%H-%M-%S"

  - trigger: ";;.lm;"
    replace: "W{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%V %a, %d"
  - trigger: ";;lm;"
    replace: "W{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%V %a, %d at %H:%M"
  - trigger: ";;now"
    replace: "W{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%V %a, %d at %H:%M"
  - trigger: "]12"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%r"
  - trigger: ";;12;"
    replace: "{{mydate}}:"
    vars:
      - name: mydate
        type: date
        params:
          format: "%r"
  - trigger: "]24"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%H:%M"

  - trigger: ";;.df;"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: '%a, %d | %d/%m/%Y | %H:%M'


  - trigger: ";;24;"
    replace: "{{mydate}}:"
    vars:
      - name: mydate
        type: date
        params:
          format: "%H:%M"

  - trigger: ";;.t;"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%H:%M"

  - trigger: ";;.tt;"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%H:%M | %r"
