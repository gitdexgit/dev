matches:

  - trigger: ";;date;"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%a %b %d %I:%M:%S %p %z %Y"

  - trigger: ";;d;"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%Y-%m-%d_%H-%M-%S"

  - trigger: ";;dd;"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%d/%m/%Y\n%a, %d, %B\n%H:%M\n\n"

  - trigger: ";;now;"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%a %m %d %H:%M"

  - trigger: ";;12;"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%r"

  - trigger: ";;24;"
    replace: "{{mydate}}:"
    vars:
      - name: mydate
        type: date
        params:
          format: "%H:%M"
