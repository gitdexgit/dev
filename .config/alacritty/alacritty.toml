[general]

[window]
opacity = 1
dynamic_title = true
decorations = "full"

  [window.dimensions]
  columns = 120
  lines = 36

[colors.primary]
background = "#000000"
foreground = "#d8d8d8"

[debug]
log_level = "Off"
render_timer = false

[cursor]
style = "Block"
unfocused_hollow = true

[[keyboard.bindings]]
key = "V"
mods = "Control"
action = "Paste"

[font]
size = 12

  [font.normal]
  family = "JetBrainsMono Nerd Font Mono"
  style = "Regular"

  [font.bold]
  family = "JetBrainsMono Nerd Font Mono"
  style = "Bold"

  [font.italic]
  family = "JetBrainsMono Nerd Font Mono"
  style = "Italic"

  [font.bold_italic]
  family = "JetBrainsMono Nerd Font Mono"
  style = "Bold Italic"
