keymap:
  - name: Universal Chords
    remap:
      C-M-A-x:
        remap:
          # Buffers / Windows
          b: { launch: ["switch-buffer"] }
          C-b: { launch: ["switch-all-buffer"] }
          k: { launch: ["i3-msg", "kill"] }

          # C-x 8 e mimicry (Emoji)
          "8":
            remap:
              e: { launch: ["emoji"] }
          # Tabs / Workspaces
          t:
            remap:
              t: { launch: ["switch-workspace"] }
              r: { launch: ["rename-workspace"] }
              m: { launch: ["move-buffer-to-workspace"] }

          # Search (Mimicking M-s prefix)
          Shift-s: { launch: ["web-search"] }
          s: { launch: ["quick-search"] }

          # good for 2nd monitor setup or multiple monitor setups it matches the
          # concept of emacs frame but if you make it bigger it's monitors in my system
          "5": # Frame/Monitor Prefix
            remap:
              o: { launch: ["i3-msg", "focus", "output", "next"] }
              m: { launch: ["i3-msg", "move", "container", "to", "output", "next"] }

          q: # Quit/System Prefix
            remap:
              r: { launch: ["i3-msg", "restart"] }
              l: { launch: ["i3-msg", "reload"] }
              q: { launch: ["i3-msg", "exit"] }
              # kill buffer/program
              k: { launch: ["xkill"] }
              # continue buffer/program
              c: { launch: ["xcontrol", "-c"] }
              # suspend buffer/program
              z: { launch: ["xcontrol", "-z"] }




