keymap:


  - name: Emacs Meta Navigation
    application:
      not: [Emacs, emacs]
    remap:
      M-f: C-right
      M-b: C-left
      M-d: C-delete
      M-v: pageup
      M-S-f: C-S-right
      M-S-b: C-S-left

  - name: Universal Chords
    remap:
      C-M-x:
        remap:
          x:
            remap:
              r: { launch: ["rename-buffer"] }
          b: { launch: ["switch-buffer"] }
          left: { launch: ["switch-buffer"] }
          C-b: { launch: ["switch-all-buffer"] }
          k: { launch: ["i3-msg", "kill"] }
          "8":
            remap:
              e:
                remap:
                  s: { launch: ["emoji"] }
          t:
            remap:
              t: { launch: ["switch-workspace"] }
              r: { launch: ["rename-workspace"] }
              m: { launch: ["move-buffer-to-workspace"] }
          Shift-s: { launch: ["web-search"] }
          s: { launch: ["quick-search"] }
          "5":
            remap:
              o: { launch: ["i3-msg", "focus", "output", "next"] }
              m: { launch: ["i3-msg", "move", "container", "to", "output", "next"] }
          q:
            remap:
              r: { launch: ["i3-msg", "restart"] }
              l: { launch: ["i3-msg", "reload"] }
              q: { launch: ["i3-msg", "exit"] }
              k: { launch: ["xkill"] }
              c: { launch: ["xcontrol", "-c"] }
              z: { launch: ["xcontrol", "-z"] }

  - name: Global Actions
    remap:
      f23: { launch: ["hide-float-windows"] }
      M-f22: { launch: ["M-x"] }
      C-M-S-Super-b: { launch: ["switch-buffer-preview"] }


