flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        # Allow loopback
        iifname "lo" accept

        # Allow established/related traffic
        ct state established,related accept

        # Allow ICMP (Ping)
        ip protocol icmp icmp type echo-request accept
        ip6 nexthdr ipv6-icmp icmpv6 type echo-request accept

        # User defined ports
        tcp dport { 22, 22000, 24800, 5351, 54727 } accept
        udp dport { 5351, 5353, 24000, 33271, 60000-61000 } accept

        # Ranges
        tcp dport { 5959-5969, 6960-6970, 7960-7970 } accept
        udp dport { 5959-5969, 6960-6970, 7960-7970 } accept

        # Local subnet specific
        ip saddr 192.168.11.0/24 tcp dport 59100 accept
        ip saddr 192.168.11.0/24 udp dport { 59200, 47542 } accept
    }

    chain forward {
        type filter hook forward priority filter; policy accept;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
