[miscs]

compose = compose

# just some commands to run straight up from keyd. kinda handy. they like popular one I use it escape+r for recent files in explorer.
# I was busy setting up everything above, I've finished to now I'm down to add things to misc that are repetetive 2025-11-27_11-56-10

# they have to be repretetive and don't belong to anything to the top and you know easy to remember. ofc we do have just opening rofi and like running scripts with fzf you know that's an option as well too

# I do use this is is really useful for taking screenshots, this is a habit. very useful delayed flameshot.
# This is with the logic fix for i3.
f2 = command(sudo -u dex -H /home/dex/scripts/dex_session_launcher.sh flameshot gui -s --pin)
f4 = command(sudo -u dex -H /home/dex/scripts/dex_session_launcher.sh bash -c "WID=\$(xdotool getactivewindow); /home/dex/scripts/ddesk/nothing/flameshotdelayed.sh; xdotool windowfocus \$WID")
f3 = command(sudo -u dex -H /home/dex/scripts/dex_session_launcher.sh bash -c "WID=\$(xdotool getactivewindow); flameshot gui; xdotool windowfocus \$WID")
f1 = command(sudo -u dex -H /home/dex/scripts/dex_session_launcher.sh bash -c "WID=\$(xdotool getactivewindow); flameshot gui --clipboard --accept-on-select; xdotool windowfocus \$WID")


# recent
r = command(sudo -u dex -H DISPLAY=:0 XAUTHORITY=/home/dex/.Xauthority dbus-launch thunar --name=floating_thunar recent:/// &)

# trash
t = command(sudo -u dex -H DISPLAY=:0 XAUTHORITY=/home/dex/.Xauthority dbus-launch thunar --name=floating_thunar trash:/// &)

# videos
v = command(sudo -u dex -H DISPLAY=:0 XAUTHORITY=/home/dex/.Xauthority dbus-launch thunar --name=floating_thunar /home/dex/Videos &)

# Pictures
p = command(sudo -u dex -H DISPLAY=:0 XAUTHORITY=/home/dex/.Xauthority dbus-launch thunar --name=floating_thunar /home/dex/Pictures &)

# audio
a = command(sudo -u dex -H DISPLAY=:0 XAUTHORITY=/home/dex/.Xauthority dbus-launch thunar --name=floating_thunar /home/dex/Audio &)


# downloads (I had to do it this way and also from bind this to Window manager key as well to run the command. Because ~/Downloads is a link <-- didn't like command())
# In your thunar/files layer
d = C-A-f24




