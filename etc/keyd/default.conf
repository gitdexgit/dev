# Hold alt then hold tab it gives you rofi switcher. It's like the browser ctrl then tab then keep holding ctrl.
# This way I don't need to remember to click Alt+meta+r anymore.
# you can while holding alt to release tab and tap tab to send A-tab and hold shift then tap A-tab. Make sure to rebind
# rofi alt+tab and A+shift+tab to cycle between items in order for it to work.
tab = timeout(A-tab, 135, A-M-r)


#
# A furter enhancement to this idea is if there is an ability to change focus as you cycle between items in real time similar to
