[global]

# when not specified, this default key tap fade for "oneshot()" func is used
oneshot_timeout = 210

# when not specified, this default key tap fade for "overload()" func is used
overload_tap_timeout = 210



[main]

# Usage:
# - tap and release to have default control.
# - hold to have mostly control keys excpet a few
# - tab and then hold to have default control keys.
# - hold and hold other modifiers for extended functionaly
# - hold and tap other modifiers for extended functionaly
capslock = overloadt(s-tier_caps, oneshot(clone_control), 180)

# the goal of compose key is to Assists capslock to extend functionality and make life easier.
