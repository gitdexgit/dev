general {
    colors = true
    interval = 5
}

order += "battery all"
order += "cpu_temperature 0"
order += "disk /"
order += "memory"
order += "cpu_usage"
order += "load"
order += "tztime local"

battery all {
    format = "BAT: %percentage %status %remaining"
    format_down = ""
}

cpu_temperature 0 {
    format = "TEMP: %degrees °C"
    path = "/sys/class/thermal/thermal_zone6/temp"
}

disk "/" {
    format = "DISK: %avail"
}

memory {
    format = "MEM: 16G/%used"
    threshold_degraded = "1G"
    format_degraded = "MEMORY LOW: %available"
}

cpu_usage {
    format = "CPU: %usage"
}

load {
    format = "LOAD: %1min"
}

tztime local {
    format = "%Y-%m-%d %H:%M:%S"
}
